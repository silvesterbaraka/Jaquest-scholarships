<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment | JaQuest</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
padding-top:96px;
background:#0b1220;
color:#f8fafc;
font-family:'Poppins',sans-serif;
-webkit-font-smoothing:antialiased;
}

nav a{
color:#e5e7eb;
transition:.25s ease;
position:relative;
}

nav a:hover{
color:#fde047;
}

nav a::after{
content:"";
position:absolute;
bottom:-4px;
left:0;
width:0%;
height:2px;
background:#fde047;
transition:.3s ease;
}

nav a:hover::after{
width:100%;
}

.card{
background:rgba(15,23,42,.85);
backdrop-filter:blur(14px);
border-radius:18px;
border:1px solid rgba(255,255,255,.15);
box-shadow:0 10px 40px rgba(0,0,0,.6);
transition:.4s ease;
}

.card:hover{
transform:translateY(-4px);
}

.input{
width:100%;
padding:12px 14px;
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.35);
border-radius:12px;
color:#f9fafb;
font-size:.9rem;
transition:.25s ease;
}

.input::placeholder{
color:#cbd5f5;
}

.input:focus{
outline:none;
border-color:#38bdf8;
box-shadow:0 0 0 3px rgba(56,189,248,.35);
background:rgba(255,255,255,.18);
transform:scale(1.01);
}

select option{
background:#0f172a;
color:#f8fafc;
}

.btn{
background:linear-gradient(to right,#2563eb,#1d4ed8);
border-radius:9999px;
padding:12px;
font-weight:600;
transition:.3s ease;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 8px 25px rgba(37,99,235,.5);
}

#mobileMenu{
background:#f5deb3;
color:#1e293b;
transition:.4s cubic-bezier(.4,0,.2,1);
}

#mobileMenu a{
color:#1e293b;
font-weight:500;
transition:.2s ease;
}

#mobileMenu a:hover{
color:#1d4ed8;
padding-left:6px;
}

#menuOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
opacity:0;
visibility:hidden;
transition:.3s ease;
z-index:40;
}

#menuOverlay.active{
opacity:1;
visibility:visible;
}

#successMsg{
animation:fadeIn .4s ease forwards;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(6px)}
to{opacity:1;transform:translateY(0)}
}

</style>
</head>

<body>

<div id="menuOverlay"></div>

<nav class="fixed top-0 left-0 w-full bg-blue-800 shadow z-50">
<div class="max-w-7xl mx-auto px-4 h-24 flex justify-between items-center">

<div class="flex items-center gap-3">
<img src="jaquestlogo.jpg" class="h-12 w-12 rounded-full ring-2 ring-white">
<span class="text-xl font-bold text-white">JaQuest</span>
</div>

<div class="hidden md:flex gap-7 text-base">
<a href="index.html">Home</a>
<a href="services.html">Services</a>
<a href="courses.html">Courses</a>
<a href="blog.html">Blog</a>
<a href="contact.html">About Us</a>
</div>

<button id="menuBtn" class="md:hidden p-2 bg-white text-blue-800 rounded-full text-xl">☰</button>

</div>

<div id="mobileMenu" class="fixed top-0 left-0 h-full w-4/5 max-w-sm shadow-2xl transform -translate-x-full md:hidden z-50">

<div class="flex justify-end p-4">
<button id="closeBtn" class="text-3xl font-bold">&times;</button>
</div>

<nav class="flex flex-col gap-5 p-6 text-lg">
<a href="index.html">Home</a>
<a href="services.html">Services</a>
<a href="courses.html">Courses</a>
<a href="blog.html">Blog</a>
<a href="contact.html">About Us</a>
</nav>

</div>
</nav>


<section class="min-h-screen pt-20 pb-16 px-4 flex justify-center items-center bg-cover bg-center"
style="background-image:url('appointment-bg.jpg')">

<div class="absolute inset-0 bg-black/75"></div>

<div class="relative z-10 w-full max-w-xl">

<div class="text-center mb-6">
<h1 class="text-3xl md:text-4xl font-bold">Book Your Appointment</h1>
<p class="text-gray-300 text-sm mt-2">Scholarships • Admissions • Visas</p>
</div>

<div class="card p-6">

<form id="appointmentForm" class="space-y-4">

<input type="text" name="company" class="hidden">

<input name="name" class="input" placeholder="Full Name *" required>

<input name="email" type="email" class="input" placeholder="Email Address *" required>

<select name="purpose" class="input" required>
<option value="">Purpose *</option>
<option>Scholarship Guidance</option>
<option>University Admission</option>
<option>Visa Support</option>
<option>General Consultation</option>
</select>

<div class="flex gap-3">

<input name="country" id="countryInput" list="countryList"
class="input flex-1" placeholder="Country / Code *" required>

<input name="phone" class="input flex-1" placeholder="Phone *" required>

</div>

<input type="hidden" name="countryCode" id="countryCode">
<datalist id="countryList"></datalist>

<input id="appointmentDate" name="date" class="input" placeholder="Appointment Date *" required>

<select name="time" class="input" required>
<option value="">Time *</option>
<option>09:00 AM</option>
<option>10:00 AM</option>
<option>11:00 AM</option>
<option>02:00 PM</option>
<option>03:00 PM</option>
</select>

<textarea name="message" rows="2" class="input" placeholder="Brief message (optional)"></textarea>

<button id="submitBtn" class="btn w-full">Submit Appointment</button>

<p class="text-xs text-gray-400 text-center">🔒 Your data is secure</p>

<div id="spinner" class="hidden text-center">
<div class="animate-spin h-8 w-8 border-t-4 border-blue-400 rounded-full mx-auto"></div>
</div>

<div id="successMsg" class="hidden text-green-400 text-center text-sm font-semibold">
✅ Appointment booked successfully
</div>

</form>

</div>

<p class="mt-6 text-center text-xs text-gray-400">
Trusted by students across Africa & Asia
</p>

</div>
</section>


<footer class="bg-blue-900 py-4 text-center text-gray-300 text-xs">
© <span id="year"></span> JaQuest. All rights reserved.
</footer>


<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>

flatpickr("#appointmentDate",{minDate:"today",disableMobile:true});


const menuBtn=document.getElementById("menuBtn");
const mobileMenu=document.getElementById("mobileMenu");
const closeBtn=document.getElementById("closeBtn");
const overlay=document.getElementById("menuOverlay");

menuBtn.onclick=()=>{
mobileMenu.classList.remove("-translate-x-full");
overlay.classList.add("active");
}

closeBtn.onclick=()=>{
mobileMenu.classList.add("-translate-x-full");
overlay.classList.remove("active");
}

overlay.onclick=closeBtn.onclick;


const countries=[
["South Sudan","+211"],["Kenya","+254"],["Uganda","+256"],
["India","+91"],["USA","+1"],["UK","+44"],["Canada","+1"],
["Australia","+61"]
];


const list=document.getElementById("countryList");
const countryInput=document.getElementById("countryInput");
const codeInput=document.getElementById("countryCode");
const phoneInput=document.querySelector('input[name="phone"]');

countries.forEach(([name,code])=>{
const opt=document.createElement("option");
opt.value=`${name} (${code})`;
list.appendChild(opt);
});


function normalize(text){
return text.toLowerCase().replace(/[^a-z ]/g,"").trim();
}


countryInput.addEventListener("input",()=>{

const typed=normalize(countryInput.value);

for(const [name,code] of countries){

if(normalize(name).startsWith(typed)){

codeInput.value=code;

if(!phoneInput.value.startsWith(code)){
phoneInput.value=code+" ";
}

break;
}
}

});


phoneInput.addEventListener("input",e=>{
e.target.value=e.target.value.replace(/[^\d+ ]/g,"");
});


const form=document.getElementById("appointmentForm");
const spinner=document.getElementById("spinner");
const success=document.getElementById("successMsg");
const btn=document.getElementById("submitBtn");


form.addEventListener("submit",async e=>{

e.preventDefault();

if(btn.disabled) return;

if(form.company.value) return;

spinner.classList.remove("hidden");
btn.disabled=true;

const data=Object.fromEntries(new FormData(form));
data.timezone=Intl.DateTimeFormat().resolvedOptions().timeZone;

try{

const controller=new AbortController();
const timeout=setTimeout(()=>controller.abort(),15000);

const res=await fetch("https://jaquest-backend.onrender.com/api/appointments",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data),
signal:controller.signal
});

clearTimeout(timeout);

const result=await res.json();

if(!res.ok) throw new Error(result.message);

success.classList.remove("hidden");

setTimeout(()=>success.classList.add("hidden"),4000);

form.reset();

}
catch(err){

alert("Submission failed. Please try again.");

}
finally{

spinner.classList.add("hidden");
btn.disabled=false;

}

});


document.getElementById("year").textContent=new Date().getFullYear();

</script>

</body>
</html>
